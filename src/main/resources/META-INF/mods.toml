# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Find more information on toml format here: https://github.com/toml-lang/toml

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Hard dependency. Current version-bound TaCZ contracts are validated exactly
# against TaCZ 1.1.8-hotfix (Curse file 8141310).
[[dependencies.${mod_id}]]
modId="tacz"
mandatory=true
versionRange="[1.1.8-hotfix]"
ordering="AFTER"
side="BOTH"

# Optional dependencies below declare ordering and sides only.
#
# These are loader-tolerant ranges, NOT support declarations:
#   - an open-ended range keeps Forge 47.4.20 from rejecting an installed
#     optional mod whose version this addon has never seen (an empty range
#     string is rejected outright by that Forge version);
#   - runtime API compatibility is capability-gated per integration by
#     structural generation detection in the compatibility facades;
#   - unknown/unverified generations disable only that integration. They are
#     neither supported nor assumed to be equivalent to a known one.
# See the compatibility report in README.md for the verified generations.

# Optional compatibility: Sophisticated Core
[[dependencies.${mod_id}]]
modId="sophisticatedcore"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Optional compatibility: Sophisticated Backpacks
[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Optional compatibility: Sophisticated Storage
[[dependencies.${mod_id}]]
modId="sophisticatedstorage"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Optional compatibility: Shoulder Surfing Reloaded
[[dependencies.${mod_id}]]
modId="shouldersurfing"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

# Optional compatibility: Leawind Third Person.
# Perspective API is checked at runtime; its dependency belongs to Leawind.
[[dependencies.${mod_id}]]
modId="leawind_third_person"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

# Optional ammo compatibility: Curios
[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
