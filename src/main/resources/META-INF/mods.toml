# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Find more information on toml format here: https://github.com/toml-lang/toml

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Hard dependency. Current version-bound TaCZ contracts are validated exactly
# against TaCZ 1.1.8-hotfix (Curse file 8141310).
[[dependencies.${mod_id}]]
modId="tacz"
mandatory=true
versionRange="[1.1.8-hotfix]"
ordering="AFTER"
side="BOTH"

# Optional compatibility: Sophisticated Core
# Tested/pinned project baseline: 1.20.1-1.3.80.2267.
[[dependencies.${mod_id}]]
modId="sophisticatedcore"
mandatory=false
versionRange="[1.3.80.2267,)"
ordering="AFTER"
side="BOTH"

# Optional compatibility: Sophisticated Backpacks
# Tested/pinned project baseline: 1.20.1-3.24.66.2095.
[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
mandatory=false
versionRange="[3.24.66.2095,)"
ordering="AFTER"
side="BOTH"

# Optional compatibility: Sophisticated Storage
# Tested/pinned project baseline: 1.20.1-1.4.81.2086.
[[dependencies.${mod_id}]]
modId="sophisticatedstorage"
mandatory=false
versionRange="[1.4.81.2086,)"
ordering="AFTER"
side="BOTH"

# SSR 5.x-only API. Current 1.20.1 upstream release is 5.0.10; the minimum
# remains 5.0.0 because the API surface used here belongs to the 5.x line.
[[dependencies.${mod_id}]]
modId="shouldersurfing"
mandatory=false
versionRange="[1.20.1-5.0.10,)"
ordering="AFTER"
side="CLIENT"

# Optional compatibility: Leawind Third Person 3.x.
# Leawind itself declares Perspective API 1.5.0-beta as required, so this
# addon must not duplicate that dependency in its own public metadata.
[[dependencies.${mod_id}]]
modId="leawind_third_person"
mandatory=false
versionRange="[3.0.3-beta,)"
ordering="AFTER"
side="CLIENT"
