buildscript {
    repositories {
        maven {
            name = "Curse Maven"
            url = "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

import java.text.SimpleDateFormat

SimpleDateFormat FORMAT = new SimpleDateFormat("MMdd-HHmmss")
FORMAT.setTimeZone(TimeZone.getTimeZone("UTC"))

apply plugin: 'org.spongepowered.mixin'

base {
    archivesName = "${mod_id}-${mod_version}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.verbose', 'true'
            property 'mixin.debug.countInjections', 'true'
            property 'mixin.checks.interfaces', 'true'
        }

        client {
            workingDirectory project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
}
/*
 * ---------------------------------------------------------------------------
 * Real upstream compatibility fixtures
 * ---------------------------------------------------------------------------
 *
 * These configurations are deliberately isolated from main/test runtime
 * classpaths. They exist only to materialize exact upstream jars used by
 * binary ABI verification tests.
 */

def compatibilityFixtureRoot =
        layout.buildDirectory.dir("compatibility-fixtures")

def allowMissingCompatibilityFixtures =
        providers.systemProperty(
                "taczaddon.compat.allowMissingFixtures"
        ).map {
            Boolean.parseBoolean(it)
        }.orElse(false)

/*
 * Exact, immutable upstream artifacts.
 *
 * Do not replace these with dynamic versions or version ranges. Updating a
 * fixture is an explicit compatibility decision and should change this table.
 */
def compatibilityFixtureSpecs = [
        // ---------------- Sophisticated 3.24 ordinary-only generations

        [
                group      : "sophisticated",
                generation : "3.24.18",
                kind       : "backpacks",
                version    : "3.24.18.1488",
                artifact   :
                        "curse.maven:sophisticated-backpacks-422301:7414216"
        ],
        [
                group      : "sophisticated",
                generation : "3.24.18",
                kind       : "core",
                version    : "1.2.117.1347",
                artifact   :
                        "curse.maven:sophisticated-core-618298:7402037"
        ],

        [
                group      : "sophisticated",
                generation : "3.24.67",
                kind       : "backpacks",
                version    : "3.24.67.2109",
                artifact   :
                        "maven.modrinth:TyCTlI4b:as0tf712"
        ],
        [
                group      : "sophisticated",
                generation : "3.24.67",
                kind       : "core",
                version    : "1.3.84.2308",
                artifact   :
                        "curse.maven:sophisticated-core-618298:8705513"
        ],

        // ---------------- Sophisticated 3.26 linked-storage generations

        [
                group      : "sophisticated",
                generation : "3.26.0",
                kind       : "backpacks",
                version    : "3.26.0.2119",
                artifact   :
                        "curse.maven:sophisticated-backpacks-422301:8817428"
        ],
        [
                group      : "sophisticated",
                generation : "3.26.0",
                kind       : "core",
                version    : "1.5.0.2316",
                artifact   :
                        "curse.maven:sophisticated-core-618298:8815743"
        ],

        [
                group      : "sophisticated",
                generation : "3.26.current",
                kind       : "backpacks",
                version    : "3.26.3.2157",
                artifact   :
                        "maven.modrinth:TyCTlI4b:XxOZuQnU"
        ],
        [
                group      : "sophisticated",
                generation : "3.26.current",
                kind       : "core",
                version    : "1.5.1.2335",
                artifact   :
                        "curse.maven:sophisticated-core-618298:8839328"
        ],

        // ---------------- Shoulder Surfing generations

        [
                group      : "shouldersurfing",
                generation : "legacy",
                kind       : "shouldersurfing",
                version    : "4.1.5",
                artifact   :
                        "curse.maven:shoulder-surfing-reloaded-243190:5455954"
        ],
        [
                group      : "shouldersurfing",
                generation : "v5",
                kind       : "shouldersurfing",
                version    : "5.0.10",
                artifact   :
                        "curse.maven:shoulder-surfing-reloaded-243190:8596413"
        ],
        [
                group      : "shouldersurfing",
                generation : "v5.current",
                kind       : "shouldersurfing",
                version    : "5.0.11",
                artifact   :
                        "maven.modrinth:kepjj2sy:P7QoCfeQ"
        ],

        // ---------------- Leawind generations

        [
                group      : "leawind",
                generation : "2",
                kind       : "leawind",
                version    : "2.2.0",
                artifact   :
                        "curse.maven:leawind-third-person-930880:5961735"
        ],
        [
                group      : "leawind",
                generation : "3",
                kind       : "leawind",
                version    : "3.0.3-beta",
                artifact   :
                        "curse.maven:leawind-third-person-930880:8602826"
        ],

        // ---------------- Perspective API baseline

        [
                group      : "perspectiveapi",
                generation : "1.5.0",
                kind       : "perspectiveapi",
                version    : "1.5.0-beta",
                artifact   : "maven.modrinth:LIqveQm1:1.5.0-beta+forge-1.20.1"
        ]
]

/*
 * One isolated, non-transitive Gradle configuration per artifact. Using raw
 * artifacts instead of fg.deobf(...) is intentional: the ABI tests inspect
 * the published upstream jar itself.
 */
def compatibilityFixtureBindings = []

compatibilityFixtureSpecs.eachWithIndex { spec, index ->
    def configuration = configurations.create(
            "compatibilityFixture${index}"
    ) {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    dependencies.add(configuration.name, spec.artifact)

    compatibilityFixtureBindings << [
            spec          : spec,
            configuration : configuration
    ]
}

def resolveCompatibilityFixtures =
        tasks.register("resolveCompatibilityFixtures") {
            group = "verification"
            description =
                    "Resolves exact upstream jars used by ABI compatibility tests"

            /*
             * Coordinates are task inputs, so changing one invalidates the
             * previously materialized fixture set.
             */
            inputs.property(
                    "fixtureCoordinates",
                    compatibilityFixtureSpecs.collect { spec ->
                        "${spec.group}:${spec.generation}:${spec.kind}:${spec.version}:${spec.artifact}"
                    }
            )

            outputs.dir(compatibilityFixtureRoot)

            doLast {
                File root = compatibilityFixtureRoot.get().asFile

                /*
                 * This task owns the entire directory. Rebuilding it prevents
                 * removed fixture definitions from leaving stale jars behind.
                 */
                project.delete(root)

                if (!root.mkdirs() && !root.isDirectory()) {
                    throw new GradleException(
                            "Unable to create compatibility fixture directory: ${root}"
                    )
                }

                List<String> manifestLines = []

                for (def binding : compatibilityFixtureBindings) {
                    def spec = binding.spec
                    Set<File> resolved

                    try {
                        resolved = binding.configuration.resolve()
                    } catch (Exception error) {
                        if (allowMissingCompatibilityFixtures.get()) {
                            logger.warn(
                                    "Unable to resolve optional compatibility fixture {} / {} / {} from {}: {}",
                                    spec.group,
                                    spec.generation,
                                    spec.kind,
                                    spec.artifact,
                                    error.message
                            )
                            continue
                        }

                        throw new GradleException(
                                "Unable to resolve mandatory compatibility fixture " +
                                        "${spec.group}/${spec.generation}/${spec.kind} from ${spec.artifact}",
                                error
                        )
                    }

                    if (resolved.size() != 1) {
                        String message =
                                "Compatibility fixture ${spec.group}/${spec.generation}/${spec.kind} " +
                                        "resolved ${resolved.size()} files instead of exactly one: ${resolved}"

                        if (allowMissingCompatibilityFixtures.get()) {
                            logger.warn(message)
                            continue
                        }

                        throw new GradleException(message)
                    }

                    File source = resolved.iterator().next()

                    String relativePath =
                            "${spec.group}/${spec.generation}/${spec.kind}.jar"

                    File target = new File(root, relativePath)

                    if (!target.parentFile.mkdirs()
                            && !target.parentFile.isDirectory()) {
                        throw new GradleException(
                                "Unable to create compatibility fixture directory: ${target.parentFile}"
                        )
                    }

                    project.copy {
                        from source
                        into target.parentFile
                        rename {
                            target.name
                        }
                    }

                    String prefix =
                            "fixture.${spec.group}.${spec.generation}.${spec.kind}"

                    /*
                     * Use '/' in manifest paths on every platform; Path.resolve
                     * accepts it on Windows as well.
                     */
                    manifestLines << "${prefix}.path=${relativePath.replace('\\', '/')}"
                    manifestLines << "${prefix}.artifact=${spec.artifact}"
                    manifestLines << "${prefix}.version=${spec.version}"
                }

                /*
                 * Write a deterministic properties file. Do not use
                 * Properties.store(), because it injects a timestamp.
                 */
                File manifest =
                        new File(root, "fixtures.properties")

                manifest.setText(
                        manifestLines
                                .sort()
                                .join(System.lineSeparator()) + System.lineSeparator(),
                        "UTF-8"
                )
            }
        }

/*
 * When "clean test" is requested in one invocation, fixture materialization
 * must happen after clean has removed build/.
 */
resolveCompatibilityFixtures.configure {
    mustRunAfter tasks.named("clean")
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    /*
    * Compile/test baseline: Sophisticated Backpacks 3.26.0.2119 +
    * Sophisticated Core 1.5.0.2316.
    *
    * Runtime metadata deliberately remains loader-tolerant for optional
    * dependency versions. Functional support is determined by structural
    * capability detection rather than the mods.toml version range.
    *
    * For Minecraft 1.20.1 Forge, 3.24.x is the verified ordinary-only
    * Sophisticated Backpacks generation. 3.26.x introduces the verified
    * linked-storage generation, whose APIs must remain behind the lazy
    * optional bridge.
    */
    compileOnly fg.deobf("curse.maven:sophisticated-core-618298:8815743")
    runtimeOnly fg.deobf("curse.maven:sophisticated-core-618298:8815743")
    compileOnly fg.deobf("curse.maven:sophisticated-backpacks-422301:8817428")
    runtimeOnly fg.deobf("curse.maven:sophisticated-backpacks-422301:8817428")
    runtimeOnly fg.deobf("curse.maven:sophisticated-storage-619320:8719374")


    implementation fg.deobf("curse.maven:timeless-and-classics-zero-1028108:8141310")

    compileOnly fg.deobf("curse.maven:shoulder-surfing-reloaded-243190:8596413")
    //runtimeOnly fg.deobf("curse.maven:shoulder-surfing-reloaded-243190:8596413")
    compileOnly fg.deobf("curse.maven:leawind-third-person-930880:8602826")
    runtimeOnly fg.deobf("curse.maven:leawind-third-person-930880:8602826")
    compileOnly fg.deobf("maven.modrinth:LIqveQm1:1.5.0-beta+forge-1.20.1")
    runtimeOnly fg.deobf("maven.modrinth:LIqveQm1:1.5.0-beta+forge-1.20.1")

    implementation fg.deobf("curse.maven:kubejs-238086:8020595")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")

    implementation fg.deobf("curse.maven:jei-238222:8851009")

    implementation fg.deobf("curse.maven:curios-309927:6418456")

    implementation fg.deobf("curse.maven:kiwi-303657:8322142")

    implementation fg.deobf("curse.maven:beyond-dimensions-1222890:8588447")
    implementation fg.deobf("curse.maven:beyond-integration-1557405:8668459")

    compileOnly fg.deobf("curse.maven:accelerated-rendering-1314021:8179092")
    runtimeOnly fg.deobf("curse.maven:just-enough-characters-250702:8117466")

    compileOnly 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named("test", Test).configure {
    useJUnitPlatform()

    dependsOn resolveCompatibilityFixtures

    /*
     * Never rely on the test process working directory.
     */
    systemProperty(
            "taczaddon.fixtures.root",
            compatibilityFixtureRoot.get().asFile.absolutePath
    )

    /*
     * Gradle's own -D properties are not automatically inherited by the
     * forked test JVM, so explicitly forward the development escape hatch.
     */
    systemProperty(
            "taczaddon.compat.allowMissingFixtures",
            providers.systemProperty(
                    "taczaddon.compat.allowMissingFixtures"
            ).orElse("false").get()
    )
}

/*
 * Java's check task already depends on test, but keeping this dependency
 * explicit documents that ABI fixture verification is part of the normal
 * verification lifecycle.
 */
tasks.named("check").configure {
    dependsOn resolveCompatibilityFixtures
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
