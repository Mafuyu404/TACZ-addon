plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar', Jar) {
    archiveClassifier.set("neoforge-${minecraft_version}")
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Cleanroom CurseMaven"
                url = uri("https://curse.cleanroommc.com")
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    maven { url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
    maven { url = "https://maven.createmod.net"; content { includeGroup "net.createmod.ponder" } }
    mavenCentral()
}

def cameraMods = providers.gradleProperty('cameraMods').getOrElse('none')
if (!(cameraMods in ['none', 'shoulder', 'leawind', 'both'])) {
    throw new GradleException('cameraMods must be none, shoulder, leawind, or both')
}

// Compile against all selected integrations; exclude only runtime artifacts for the smoke matrix.
def ecosystemMods = providers.gradleProperty('ecosystemMods').getOrElse('both')
if (!(ecosystemMods in ['none', 'create', 'beyond', 'both'])) {
    throw new GradleException('ecosystemMods must be none, create, beyond, or both')
}
def optionalMods = providers.gradleProperty('optionalMods').getOrElse('all')
if (!(optionalMods in ['all', 'none'])) throw new GradleException('optionalMods must be all or none')
def smoke = providers.gradleProperty('smoke').getOrElse('false').toBoolean()
configurations.matching { it.name in ['runtimeClasspath', 'testRuntimeClasspath'] }.configureEach {
    if (optionalMods == 'none' || !(ecosystemMods in ['create', 'both'])) {
        exclude group: 'curse.maven', module: 'create-storage-neo-forge-1281770'
        exclude group: 'maven.modrinth', module: 'LNytGWDc'
    }
    if (optionalMods == 'none' || !(ecosystemMods in ['beyond', 'both'])) {
        exclude group: 'curse.maven', module: 'beyond-integration-1557405'
        exclude group: 'maven.modrinth', module: '6zGxpbt7'
    }
    if (optionalMods == 'none') {
        ['sophisticated-backpacks-422301', 'sophisticated-core-618298', 'curios-309927', 'jei-238222',
         'shoulder-surfing-reloaded-243190', 'leawind-third-person-930880', 'perspective-api-1575322'].each {
            exclude group: 'curse.maven', module: it
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = file("run/camera-compat/${cameraMods}")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            if (smoke) {
                gameDirectory = file("run/parity-smoke/${optionalMods}-${ecosystemMods}")
                programArgument '--initSettings'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    unitTest {
        enable()
        testedMod.set(project.provider(() -> mods.getByName(mod_id)))
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.64" // Runtime copy is bundled by Create
    implementation "maven.modrinth:LNytGWDc:88L641Un" // Create 6.0.8, required by Create Storage
    implementation "curse.maven:create-storage-neo-forge-1281770:8928251"
    implementation "curse.maven:beyond-integration-1557405:8868605"
    implementation "maven.modrinth:6zGxpbt7:FP6mjH0z" // Beyond Dimensions 0.7.30
    implementation "curse.maven:tacz-1-21-1-1353462:9027337"

    compileOnly "curse.maven:shoulder-surfing-reloaded-243190:8725628"


    implementation "curse.maven:sophisticated-backpacks-422301:9036628"
    implementation "curse.maven:sophisticated-core-618298:9039572"

    implementation "curse.maven:jei-238222:8829744"
    implementation "curse.maven:curios-309927:6529130"
    // 8602835 is Leawind 3.0.3-beta and requires this Perspective API at runtime.
    // The addon itself requires neither camera mod nor Perspective API.
    compileOnly "curse.maven:perspective-api-1575322:8595570"
    // Opt-in development matrix: none (default), shoulder, leawind, both.
    if (cameraMods in ['shoulder', 'both']) {
        localRuntime "curse.maven:shoulder-surfing-reloaded-243190:8725628"
    }
    if (cameraMods in ['leawind', 'both']) {
        localRuntime "curse.maven:leawind-third-person-930880:8602835"
        localRuntime "curse.maven:perspective-api-1575322:8595570"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    //options.compilerArgs.add('-Xlint:deprecation')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
